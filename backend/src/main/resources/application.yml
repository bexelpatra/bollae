spring:
  application:
    name: boat-sched

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:boatsched}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true

jwt:
  secret: ${JWT_SECRET:mySecretKeyForBoatSchedJWTTokenGenerationPleaseChangeInProduction}
  expiration: 86400000

firebase:
  config-path: ${FIREBASE_CONFIG_PATH:}

server:
  port: 8080
