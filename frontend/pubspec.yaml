name: boat_sched
description: Boat Scheduling Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP client
  http: ^1.1.0

  # State management
  provider: ^6.1.1

  # Firebase messaging for push notifications
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.9

  # Secure storage for tokens
  flutter_secure_storage: ^9.0.0

  # Shared preferences
  shared_preferences: ^2.2.2

  # Date/time utilities
  intl: ^0.18.1

  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
