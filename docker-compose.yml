version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: boatsched-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_DATABASE: ${DB_NAME:-boatsched}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: boatsched-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-boatsched}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-password}
      JWT_SECRET: ${JWT_SECRET:-mySecretKeyForBoatSchedJWTTokenGenerationPleaseChangeInProduction}
      FIREBASE_CONFIG_PATH: ${FIREBASE_CONFIG_PATH:-}
    depends_on:
      mysql:
        condition: service_healthy
    # Uncomment if you have firebase-config.json
    # volumes:
    #   - ./firebase-config.json:/app/firebase-config.json:ro

volumes:
  mysql-data:
